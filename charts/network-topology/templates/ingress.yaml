{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "network-topology.fullname" . }}
  labels:
    {{- include "network-topology.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hostnames }}
    {{- range .Values.ingress.hostnames }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.pathPrefix | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "network-topology.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
    {{- else }}
    - http:
        paths:
          - path: {{ .Values.ingress.pathPrefix | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "network-topology.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    {{- end }}
{{- end }}
